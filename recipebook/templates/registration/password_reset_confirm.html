{% extends 'registration_base.html' %}

{% block content %}
    {% if form.errors %}
        {% for field in form %}
            {% for error in field.errors %}
                {{ error }}    
            {% endfor %}
        {% endfor %}
    {% endif %}
    <h4>Password Reset Confirm Page</h4>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Reset Password</button>
    </form>
{% endblock %}
